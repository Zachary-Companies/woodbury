appId: com.zachary.woodbury
productName: Woodbury

publish:
  provider: github
  owner: Zachary-Companies
  repo: woodbury
  # Publish straight to a real release. The default (draft) is why v1.1.2-v1.2.3
  # left their installers sitting in unpublished drafts while the public release
  # for the same tag stayed empty and the site's download link 404'd.
  releaseType: release

protocols:
  - name: Woodbury Extension Install
    schemes:
      - woodbury

directories:
  output: release

# Override "main" inside the built .app only — doesn't touch source package.json
extraMetadata:
  main: electron/main.js

files:
  - dist/**/*
  - node_modules/**/*
  - electron/**/*
  - chrome-extension/**/*
  - configs/**/*
  - tools/desktop-hook
  - package.json
  # Exclude large packages not needed by the packaged app
  - "!node_modules/puppeteer/**"
  - "!node_modules/puppeteer-core/**"
  - "!node_modules/canvas/**"
  - "!node_modules/.cache/**"

mac:
  category: public.app-category.developer-tools
  icon: electron/icons/icon.png
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
  hardenedRuntime: true

win:
  icon: electron/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: electron/icons/icon.ico
  uninstallerIcon: electron/icons/icon.ico

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

asar: true
asarUnpack:
  - node_modules/ws/**
  - node_modules/uiohook-napi/**
  - node_modules/robotjs/**
  - node_modules/node-gyp-build/**
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/onnxruntime-node/**
  - node_modules/onnxruntime-common/**
  - tools/**
